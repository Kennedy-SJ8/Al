<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Para Alison</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌻</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF1B8;
    --gold:#E8630F;
    --brown:#1E1D1D;
    --soil:#140A00;
    --bg-1:#FFF8E8;
    --bg-2:#F3E3C2;
    --ink: rgba(43,27,14,0.92);
    --ink-soft: rgba(43,27,14,0.6);
    --bloom: 0;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    font-family:'Work Sans', sans-serif;
    overflow:hidden;
    background: radial-gradient(ellipse at 50% 38%, var(--bg-1) 0%, var(--bg-2) 100%);
  }
  main{
    position:relative; z-index:2;
    height:100dvh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 8vh 6vw 6vh;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }

  .flower-wrap{
    position:relative;
    width:min(46vw, 260px);
    aspect-ratio:1/1;
    margin-bottom: clamp(24px, 4vh, 48px);
    filter: drop-shadow(0 10px 40px rgba(0,0,0,0.5));
  }
  #petalCanvas{
    position:absolute; inset:0; width:100%; height:100%; display:block;
  }
  #flowerSvg{
    position:absolute; inset:0; width:100%; height:100%; overflow:visible;
  }
  .core{
    fill: var(--soil);
    stroke: var(--brown);
    stroke-width: 1;
    transform: scale(calc(0.85 + var(--bloom) * 0.15));
    transform-origin: 100px 100px;
    transition: transform 1.1s ease;
  }
  .seed{
    fill: var(--brown);
    opacity: calc(0.4 + var(--bloom)*0.6);
    transition: opacity 1.1s ease;
  }
  .stem{
    stroke: var(--gold);
    stroke-width: 3;
    opacity: 0.5;
  }

  .stage{
    text-align:center;
    max-width: 620px;
  }
  .eyebrow{
    font-size: 0.78rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin: 0 0 10px;
    font-weight: 400;
  }
  h1, .line{
    font-family:'Fraunces', serif;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.28;
    margin: 0;
    font-size: clamp(1.5rem, 4.4vw, 2.4rem);
  }
  .sub{
    margin-top: 16px;
    font-size: clamp(0.95rem, 2vw, 1.05rem);
    color: var(--ink-soft);
    line-height: 1.6;
    font-weight: 300;
  }
  .sig{
    margin-top: 28px;
    font-family:'Fraunces', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--gold);
  }
  .motto{
    margin-top: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .motto span{
    display: block;
    width: 26px;
    height: 1px;
    background: var(--gold);
    opacity: 0.55;
  }
  .motto p{
    margin: 0;
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1rem, 2.6vw, 1.2rem);
    letter-spacing: 0.03em;
    color: var(--gold);
  }

  .dots{
    position:absolute;
    top: 5vh; left:0; right:0;
    display:flex; justify-content:center; gap:8px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--ink-soft);
    opacity: 0.35;
    transition: opacity .4s ease, transform .4s ease;
  }
  .dot.active{ opacity:1; transform: scale(1.3); background: var(--gold); }

  .restart{
    margin-top: 30px;
    background: transparent;
    border: 1px solid var(--ink-soft);
    color: var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size: 0.85rem;
    padding: 10px 22px;
    border-radius: 999px;
    cursor:pointer;
    transition: border-color .3s ease, background .3s ease, transform .2s ease;
  }
  .restart:hover{ border-color: var(--gold); background: rgba(255,195,0,0.08); transform: scale(1.05); }

  .fade{
    animation: fadeIn 0.9s ease both;
  }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(8px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);} }

  @keyframes gentleFloat{ 0%,100%{ transform:translateY(0) rotate(-1deg); } 50%{ transform:translateY(-12px) rotate(1deg); } }
  .float{ animation: gentleFloat 4s ease-in-out infinite; }

  @keyframes glowPulse{
    0%,100%{ filter: drop-shadow(0 0 10px rgba(232,99,15,0.3)) drop-shadow(0 10px 40px rgba(0,0,0,0.5)); }
    50%{ filter: drop-shadow(0 0 25px rgba(232,99,15,0.7)) drop-shadow(0 10px 40px rgba(0,0,0,0.5)); }
  }
  .glow{ animation: glowPulse 2s ease-in-out infinite; }

  @keyframes petalFall{
    0%{ transform: translateY(-10vh) translateX(0) rotate(0deg) scale(0.3); opacity:0; }
    10%{ opacity:0.9; transform: scale(1); }
    50%{ transform: translateX(30px) rotate(360deg); }
    100%{ transform: translateY(100vh) translateX(-20px) rotate(720deg) scale(0.2); opacity:0; }
  }
  .petal-fall{
    position:fixed; pointer-events:none; z-index:5;
    animation: petalFall linear forwards;
  }

  @keyframes heartPulse{
    0%{ transform: scale(0) translateY(0); opacity:0; }
    15%{ transform: scale(1.3) translateY(-15px); opacity:1; }
    30%{ transform: scale(0.85) translateY(-30px); }
    45%{ transform: scale(1.1) translateY(-50px); }
    100%{ transform: scale(0.4) translateY(-150px); opacity:0; }
  }
  .heart-float{
    position:fixed; pointer-events:none; z-index:10;
    animation: heartPulse 2.2s ease-out forwards;
  }

  @keyframes sparkleAnim{
    0%{ opacity:0; transform: scale(0) rotate(0deg); }
    30%{ opacity:1; transform: scale(1.3) rotate(120deg); }
    60%{ transform: scale(0.8) rotate(240deg); }
    100%{ opacity:0; transform: scale(0) rotate(360deg); }
  }
  .sparkle{
    position:fixed; pointer-events:none; z-index:10;
    animation: sparkleAnim 1.4s ease-out forwards;
  }

  @keyframes shimmer{ 0%{ background-position:-200% center; } 100%{ background-position:200% center; } }
  .shimmer{
    background: linear-gradient(90deg, var(--ink) 0%, var(--gold) 30%, #FFD700 50%, var(--gold) 70%, var(--ink) 100%);
    background-size: 200% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation: shimmer 2.5s linear infinite;
  }

  @keyframes textReveal{
    0%{ clip-path: inset(0 100% 0 0); opacity:0; }
    30%{ opacity:1; }
    100%{ clip-path: inset(0 0% 0 0); opacity:1; }
  }
  .reveal{ animation: textReveal 1.4s ease-out forwards; }

  @keyframes backgroundFloat{
    0%{ transform: translateY(110vh) rotate(0deg); opacity:0; }
    15%{ opacity:0.5; }
    85%{ opacity:0.5; }
    100%{ transform: translateY(-10vh) rotate(360deg); opacity:0; }
  }
  .bg-particle{
    position:fixed; pointer-events:none; z-index:1;
    animation: backgroundFloat linear infinite;
  }

  @keyframes eyeBrowPop{
    0%{ opacity:0; transform: translateY(-10px) scale(0.8); letter-spacing: 0.15em; }
    100%{ opacity:1; transform: translateY(0) scale(1); letter-spacing: 0.02em; }
  }
  .eyebrow{ animation: eyeBrowPop 0.8s ease-out both; }

  @keyframes dotBounce{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.5); }
  }
  .dot.active{ animation: dotBounce 0.6s ease-out; }

  @keyframes hintBreathe{
    0%,100%{ opacity:0.35; transform: translateY(0); }
    50%{ opacity:0.9; transform: translateY(-3px); }
  }
  .hint{ animation: hintBreathe 2.8s ease-in-out infinite; }

  @keyframes restartGlow{
    0%,100%{ box-shadow: 0 0 0 rgba(232,99,15,0); }
    50%{ box-shadow: 0 0 15px rgba(232,99,15,0.3); }
  }
  .restart:hover{ animation: restartGlow 1.5s ease-in-out infinite; }

  @keyframes wink{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1) rotate(10deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .core, .seed, .fade, .hint, .heart-float, .sparkle, .petal-float, .bg-particle, .glow, .float, .shimmer{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="dots" id="dots"></div>

<main id="scene">
  <div class="flower-wrap float">
    <canvas id="petalCanvas"></canvas>
    <svg viewBox="0 0 200 200" id="flowerSvg">
      <line class="stem" x1="100" y1="130" x2="100" y2="200"/>
      <circle class="core" cx="100" cy="100" r="34"/>
      <g id="seeds"></g>
    </svg>
  </div>

  <div class="stage" id="stageText"></div>
</main>

<div class="hint" id="hint">toca para continuar</div>

<script>
const SCENES = [
  {
    eyebrow: "21 de septiembre",
    text: "Hoy es el dia de las flores amarillas.",
    sub: "Y quiero que sepas algo que llevo tiempo callando.",
  },
  {
    eyebrow: "tu sonrisa",
    text: "Tu sonrisa se quedo conmigo.",
    sub: "Desde la primera vez que te vi, no he podido dejar de pensar en ti. No es solo atraccion, es algo mas profundo.",
  },
  {
    eyebrow: "lo que siento",
    text: "Quiero que sepas que te quiero, Alison.",
    sub: "No como un capricho, no como algo pasajero. Te quiero con calma, con ganas, con todo lo que soy.",
  },
  {
    eyebrow: "lo que descubri",
    text: "Contigo descubri que el amor no siempre llega fuerte.",
    sub: "A veces llega despacio, como una semilla que va creciendo. Y un dia te das cuenta de que ya no puedes vivir sin ella.",
  },
  {
    eyebrow: "mi verdad",
    text: "No me importa el timing.",
    sub: "Solo me importa que sepas que existes para mi. Que eres lo mas hermoso que me ha pasado. Que te amo, Alison.",
  },
  {
    eyebrow: "",
    text: "Este girasol es tuyo.",
    sub: "Por el dia de las flores amarillas. Por ser mi persona favorita. Por hacerme creer en esto.",
    motto: "FLORES AMARILLAS, AMOR VERDADERO",
    final: true,
  },
];

const PETAL_COUNT = 14;
let i = 0;
let bloomCurrent = 0;
let bloomAnimFrame = 0;

const dotsEl = document.getElementById('dots');
const stageTextEl = document.getElementById('stageText');
const hintEl = document.getElementById('hint');
const sceneEl = document.getElementById('scene');

SCENES.forEach(() => {
  const d = document.createElement('div');
  d.className = 'dot';
  dotsEl.appendChild(d);
});

const petalAngles = [];
for (let p = 0; p < PETAL_COUNT; p++){
  petalAngles.push((360 / PETAL_COUNT) * p);
}

function applyBloom(v){
  bloomCurrent = v;
  document.documentElement.style.setProperty('--bloom', v.toFixed(3));
}

function animateBloomTo(target){
  cancelAnimationFrame(bloomAnimFrame);
  const from = bloomCurrent;
  const duration = 1000;
  const startTime = performance.now();
  function step(now){
    const t = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    applyBloom(from + (target - from) * eased);
    if (t < 1) bloomAnimFrame = requestAnimationFrame(step);
  }
  bloomAnimFrame = requestAnimationFrame(step);
}

function spawnHeart(){
  const el = document.createElement('div');
  el.className = 'heart-float';
  el.textContent = ['🌻','💛','✨','🧡','🌸','🌼','💛'][Math.floor(Math.random()*7)];
  el.style.left = (20 + Math.random()*60) + 'vw';
  el.style.top = (50 + Math.random()*40) + 'vh';
  el.style.fontSize = (0.9 + Math.random()*1.5) + 'rem';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

function spawnPetals(count){
  for(let k=0; k<count; k++){
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className = 'petal-fall';
      el.textContent = ['🌻','🌼','✿','❀','✾','🌷','🏵️','💮'][Math.floor(Math.random()*8)];
      el.style.left = Math.random()*100 + 'vw';
      el.style.animationDuration = (2.5 + Math.random()*2.5) + 's';
      el.style.fontSize = (0.6 + Math.random()*1) + 'rem';
      el.style.opacity = (0.4 + Math.random()*0.4).toFixed(2);
      document.body.appendChild(el);
      setTimeout(()=> el.remove(), 5500);
    }, k*150);
  }
}

function spawnBackgroundParticles(count){
  const emojis = ['🌻','💛','✨','🌼','🧡','✿','❀'];
  for(let k=0; k<count; k++){
    const el = document.createElement('div');
    el.className = 'bg-particle';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100 + 'vw';
    el.style.animationDuration = (8 + Math.random()*12) + 's';
    el.style.animationDelay = Math.random()*5 + 's';
    el.style.fontSize = (0.8 + Math.random()*0.8) + 'rem';
    el.style.opacity = (0.15 + Math.random()*0.2).toFixed(2);
    document.body.appendChild(el);
  }
}

function spawnSparkles(count){
  for (let k = 0; k < count; k++){
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.style.left = (30 + Math.random()*40) + 'vw';
      el.style.top = (30 + Math.random()*40) + 'vh';
      el.style.width = (4 + Math.random()*6) + 'px';
      el.style.height = el.style.width;
      el.style.background = ['var(--gold)','#FFD700','#FFA500'][Math.floor(Math.random()*3)];
      el.style.borderRadius = '50%';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }, k * 60);
  }
}

function renderScene(){
  const s = SCENES[i];
  animateBloomTo(i / (SCENES.length - 1));

  [...dotsEl.children].forEach((d, idx) => d.classList.toggle('active', idx === i));

  stageTextEl.classList.remove('fade');
  void stageTextEl.offsetWidth;
  stageTextEl.classList.add('fade');

  stageTextEl.innerHTML = `
    ${s.eyebrow ? `<p class="eyebrow">${s.eyebrow}</p>` : ''}
    <h1 class="line reveal${s.final ? ' shimmer' : ''}">${s.text}</h1>
    ${s.sub ? `<p class="sub reveal" style="animation-delay:0.4s">${s.sub}</p>` : ''}
    ${s.motto ? `<div class="motto"><span></span><p>${s.motto}</p><span></span></div>` : ''}
    ${s.signature ? `<p class="sig">${s.signature}</p>` : ''}
    ${s.final ? `<button class="restart" id="restartBtn">ver de nuevo</button>` : ''}
  `;

  hintEl.style.display = s.final ? 'none' : 'block';

  const wrap = document.querySelector('.flower-wrap');
  if (i >= 2) wrap.classList.add('glow');
  if (i < 2) wrap.classList.remove('glow');

  if (i > 0){
    for (let h = 0; h < 4; h++) setTimeout(() => spawnHeart(), h * 250);
  }
  if (s.final){
    spawnSparkles(18);
    spawnPetals(30);
  }
  if (i === 3){
    spawnPetals(10);
    spawnSparkles(8);
  }

  if (s.final){
    const btn = document.getElementById('restartBtn');
    btn.addEventListener('click', (e) => { e.stopPropagation(); i = 0; renderScene(); });
  }
}

function next(){
  if (i < SCENES.length - 1){
    i++;
    renderScene();
  }
}

sceneEl.addEventListener('click', (e) => {
  if (e.target.closest('#restartBtn')) return;
  next();
});
window.addEventListener('keydown', (e) => {
  if (['Enter',' ','ArrowRight'].includes(e.key)) next();
});

const seedsG = document.getElementById('seeds');
for (let s = 0; s < 40; s++){
  const ns = "http://www.w3.org/2000/svg";
  const r = 3 + Math.random() * 26;
  const a = Math.random() * Math.PI * 2;
  const cx = 100 + Math.cos(a) * r;
  const cy = 100 + Math.sin(a) * r;
  const dot = document.createElementNS(ns, "circle");
  dot.setAttribute("class", "seed");
  dot.setAttribute("cx", cx.toFixed(1));
  dot.setAttribute("cy", cy.toFixed(1));
  dot.setAttribute("r", (0.8 + Math.random()*0.9).toFixed(2));
  seedsG.appendChild(dot);
}

applyBloom(0);
renderScene();
spawnBackgroundParticles(8);

(function initShader(){
  const canvas = document.getElementById('petalCanvas');
  const wrap = document.querySelector('.flower-wrap');
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const glCanvas = document.createElement('canvas');
  const gl = glCanvas.getContext('webgl', { antialias:false, alpha:false });
  if (!gl) return;

  const VERT = `attribute vec2 a_position;
  void main(){ gl_Position = vec4(a_position, 0.0, 1.0); }`;

  const FRAG = `
  #ifdef GL_FRAGMENT_PRECISION_HIGH
  precision highp float;
  #else
  precision mediump float;
  #endif
  uniform vec3 u_colors[8];
  uniform vec4 u_scene; uniform vec4 u_shape; uniform vec4 u_surface;
  uniform vec4 u_finish; uniform vec4 u_transform; uniform vec4 u_space;
  #define u_resolution u_scene.xy
  #define u_time u_scene.z
  #define u_colorCount u_scene.w
  #define u_scale u_shape.x
  #define u_intensity u_shape.y
  #define u_warp u_shape.w
  #define u_detail u_surface.x
  #define u_contrast u_surface.y
  #define u_brightness u_surface.z
  #define u_saturation u_surface.w
  #define u_vignette u_finish.y
  #define u_grain u_finish.w
  #ifdef GL_FRAGMENT_PRECISION_HIGH
  #define u_seed u_transform.x
  #else
  #define u_seed mod(u_transform.x, 31.0)
  #endif
  #define u_drift u_transform.z
  #define u_offset u_space.xy

  float hash21(vec2 p){
  #ifndef GL_FRAGMENT_PRECISION_HIGH
    p = mod(p, 31.0);
  #endif
    p = fract(p * vec2(234.34, 435.345));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
  }
  float noise(vec2 p){
    vec2 i = floor(p); vec2 f = fract(p);
    vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(hash21(i), hash21(i+vec2(1.0,0.0)), u.x),
               mix(hash21(i+vec2(0.0,1.0)), hash21(i+vec2(1.0,1.0)), u.x), u.y);
  }
  float fbm(vec2 p){
    float v=0.0; float a=0.5;
    for (int k=0;k<5;k++){ v += a*noise(p); p = p*2.03 + vec2(17.0,9.2); a*=0.5; }
    return v;
  }
  vec3 palette(float x){
    float n = max(u_colorCount - 1.0, 1.0);
    float f = clamp(x, 0.0, 1.0) * n;
    vec3 col = u_colors[0];
    for (int idx=0; idx<7; idx++){
      if (float(idx) < n)
        col = mix(col, u_colors[idx+1], smoothstep(0.0,1.0, clamp(f-float(idx),0.0,1.0)));
    }
    return col;
  }
  vec3 shade(vec2 p, float t){
    vec2 q = p * 1.6;
    float amp = 0.25 + u_intensity * 0.85;
    for (float k = 1.0; k < 5.0; k += 1.0){
      q.x += amp/k * cos(k*2.4*q.y + t*0.8 + u_seed);
      q.y += amp/k * cos(k*1.7*q.x + t*0.6);
    }
    return palette(0.5 + 0.5*sin(q.x+q.y));
  }
  void main(){
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    vec2 p = (gl_FragCoord.xy - 0.5*u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    p *= u_scale;
    p += u_offset;
    if (u_drift > 0.0001) p += u_drift * vec2(sin(u_time*0.31), cos(u_time*0.23));
    if (u_warp > 0.0){
      p += u_warp * (vec2(fbm(p*u_detail+u_seed), fbm(p*u_detail+vec2(5.2,1.3))) - 0.5);
    }
    vec3 col = shade(p, u_time);
    if (abs(u_contrast - 1.0) > 0.0001) col = (col - 0.5) * u_contrast + 0.5;
    if (abs(u_saturation - 1.0) > 0.0001){
      float luma = dot(col, vec3(0.299,0.587,0.114));
      col = mix(vec3(luma), col, u_saturation);
    }
    if (abs(u_brightness) > 0.0001) col += u_brightness;
    if (u_vignette > 0.0001){
      float vd = length(uv - 0.5) * 1.41421356;
      col *= 1.0 - u_vignette * smoothstep(0.35, 1.0, vd);
    }
    if (u_grain > 0.0001){
      col += (hash21(gl_FragCoord.xy + vec2(u_seed*17.0, u_seed*31.0)) - 0.5) * u_grain;
    }
    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
  }`;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  gl.useProgram(program);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(program, "a_position");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const COLORS = [
    [0.16,0.02,0.10], [0.55,0.05,0.12], [1.0,0.30,0.02],
    [1.0,0.70,0.0], [1.0,0.20,0.45], [1.0,0.92,0.45],
    [1.0,0.92,0.45], [1.0,0.92,0.45]
  ];
  const U = {
    colorCount: 6, scale: 0.9, intensity: 0.5, warp: 0.6,
    detail: 1.8, contrast: 1.15, brightness: 0.02, saturation: 1.35,
    vignette: 0.0, grain: 0.02, seed: 707.0, drift: 0.06,
    offsetX: 0.0, offsetY: 0.0, timeScale: 0.12
  };

  const uni = {
    colors: gl.getUniformLocation(program, "u_colors"),
    scene: gl.getUniformLocation(program, "u_scene"),
    shape: gl.getUniformLocation(program, "u_shape"),
    surface: gl.getUniformLocation(program, "u_surface"),
    finish: gl.getUniformLocation(program, "u_finish"),
    transform: gl.getUniformLocation(program, "u_transform"),
    space: gl.getUniformLocation(program, "u_space"),
  };
  gl.uniform3fv(uni.colors, new Float32Array(COLORS.flat()));
  gl.uniform4f(uni.shape, U.scale, U.intensity, 0.5, U.warp);
  gl.uniform4f(uni.surface, U.detail, U.contrast, U.brightness, U.saturation);
  gl.uniform4f(uni.finish, 0.0, U.vignette, 0.0, U.grain);
  gl.uniform4f(uni.transform, U.seed, 0.0, U.drift, 0.0);
  gl.uniform4f(uni.space, U.offsetX, U.offsetY, 0, 0);

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = wrap.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width * dpr));
    const h = Math.max(1, Math.round(rect.height * dpr));
    if (glCanvas.width !== w || glCanvas.height !== h){
      glCanvas.width = w; glCanvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    if (canvas.width !== w || canvas.height !== h){
      canvas.width = w; canvas.height = h;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  const start = performance.now();
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function buildPetalPath(w, h){
    const path = new Path2D();
    const size = Math.min(w, h);
    const cx = w / 2, cy = h / 2;
    const s = 0.32 + bloomCurrent * 0.68;
    const offset = 0.26 * size * s;
    const rx = 0.065 * size * s;
    const ry = 0.17 * size * s;
    petalAngles.forEach((angleDeg) => {
      const rad = (angleDeg * Math.PI) / 180;
      const ex = cx + Math.sin(rad) * offset;
      const ey = cy - Math.cos(rad) * offset;
      path.ellipse(ex, ey, rx, ry, rad, 0, Math.PI * 2);
    });
    return path;
  }

  function frame(now){
    resize();
    const t = reduceMotion ? 0 : ((now - start) / 1000) * U.timeScale;
    gl.uniform4f(uni.scene, glCanvas.width, glCanvas.height, t, U.colorCount);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(glCanvas, 0, 0, w, h);
    ctx.globalCompositeOperation = 'destination-in';
    ctx.globalAlpha = 0.15 + bloomCurrent * 0.85;
    ctx.fillStyle = '#fff';
    ctx.fill(buildPetalPath(w, h));
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
